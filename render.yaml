services:
  - type: web
    runtime: static
    name: mhwater
    # public/ is the only directory that may be served. The build copies
    # scripts/published-files.txt and nothing else, so dotfiles and .cursor/
    # are not resources and the catch-all 301 applies.
    buildCommand: bash scripts/publish-public.sh
    staticPublishPath: public
    # HTTP 301s to the hub. Render applies these from a synced Blueprint or
    # from the mhwater service: Dashboard → Redirects/Rewrites.
    # A rule is skipped when a file exists at that path. The HTML pages
    # are not published, so a saved rule is not answered with HTTP 200.
    # Git deploy does not apply this build command or publish directory.
    # The live mhwater service already has both Dashboard settings:
    # Dashboard → Settings → Build & Deploy → Build Command
    #   bash scripts/publish-public.sh
    # Dashboard → Settings → Build & Deploy → Publish Directory
    #   public
    # Keep them together. Publish Directory alone publishes nothing
    # useful, because public/ is not committed.
    # Hosts: motorhomewater.co.uk and mhwater.onrender.com.
    routes:
      - type: redirect
        source: /
        destination: https://motorhometools.co.uk/water/
      - type: redirect
        source: /index.html
        destination: https://motorhometools.co.uk/water/
      - type: redirect
        source: /gas.html
        destination: https://motorhometools.co.uk/water/gas.html
      - type: redirect
        source: /tanks.html
        destination: https://motorhometools.co.uk/water/tanks.html
      - type: redirect
        source: /cassette.html
        destination: https://motorhometools.co.uk/water/cassette.html
      - type: redirect
        source: /bottles.html
        destination: https://motorhometools.co.uk/water/bottles.html
      - type: redirect
        source: /hotwater.html
        destination: https://motorhometools.co.uk/water/hotwater.html
      - type: redirect
        source: /winterising.html
        destination: https://motorhometools.co.uk/water/winterising.html
      - type: redirect
        source: /topup.html
        destination: https://motorhometools.co.uk/water/topup.html
      - type: redirect
        source: /*
        destination: https://motorhometools.co.uk/water/
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
